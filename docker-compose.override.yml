version: "3.8"

services:
  mongo:
    image: mongo:7.0
    labels:
      maintainer: "MLOps Assignment 3"
      description: "MongoDB for currency exchange rate storage"
      version: "7.0"
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: airflow
      MONGO_INITDB_ROOT_PASSWORD: airflow
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  mongo-express:
    image: mongo-express:1.0
    labels:
      maintainer: "MLOps Assignment 3"
      description: "Mongo Express web UI for MongoDB"
      version: "1.0"
    restart: unless-stopped
    depends_on:
      - mongo
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: airflow
      ME_CONFIG_MONGODB_ADMINPASSWORD: airflow
      ME_CONFIG_MONGODB_URL: mongodb://airflow:airflow@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH: "false"
    ports:
      - "8081:8081"

volumes:
  mongo_data:
    driver: local
